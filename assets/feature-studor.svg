  <rect x="32" y="258" width="62" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="63" y="273" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">Plotly</text>
