    <rect x="32" y="124" width="36" height="3" rx="1.5" fill="#E0C49A">
      <animate attributeName="width" values="36;64;36" dur="4s" repeatCount="indefinite"/></rect>
  <text x="32" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#D9DEE6">Storefront with separate frontend and backend:</text>
  <text x="32" y="172" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#D9DEE6">catalog, cart, checkout, auth and EN/DE. The whole</text>
