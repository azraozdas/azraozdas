  <rect x="95" y="228" width="92" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="141" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">TypeScript</text>
  <rect x="195" y="228" width="70" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="230" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">Express</text>
  <rect x="273" y="228" width="62" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="304" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">Prisma</text>
