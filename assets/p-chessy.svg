<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270">
  <defs>
    <clipPath id="cchessy"><rect width="490" height="270" rx="18"/></clipPath>
    <filter id="bchessy" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="gchessy" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <g clip-path="url(#cchessy)">
    <rect width="490" height="270" fill="#0B1020"/>
    <g filter="url(#bchessy)" opacity=".6">
      <circle cx="98" cy="20" r="122" fill="#4A3B5C">
        <animate attributeName="cx" values="98;196;98" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="416" cy="270" r="135" fill="#1E3A5F">
        <animate attributeName="cx" values="416;318;416" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="490" height="270" fill="url(#gchessy)"/>
    <rect x=".5" y=".5" width="489" height="269" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="28" cy="28" r="5" fill="#475569"/><circle cx="45" cy="28" r="5" fill="#475569"/><circle cx="62" cy="28" r="5" fill="#475569"/>
    <text x="466" y="33" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">chessy</text>
    <text x="28" y="72" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#94A3B8">Game · AI opponent</text>
    <text x="28" y="100" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1F5F9">Chessy</text>
    <text x="28" y="122" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">Cyberpunk-themed chess game with a computer opponent,</text>
    <text x="28" y="143" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">two-player mode, an openings learning section, sound and</text>
    <text x="28" y="164" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">animations. Team project.</text>
    <rect x="28" y="224" width="62" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="59" y="239" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">Python</text>
    <rect x="98" y="224" width="62" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="130" y="239" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">Pygame</text>
    <rect x="169" y="224" width="70" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="204" y="239" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">Game AI</text>
  </g>
</svg>
