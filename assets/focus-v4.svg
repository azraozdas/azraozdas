<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="156" viewBox="0 0 1000 156">
  <rect width="1000" height="156" rx="20" fill="#1B1530"/>
  <rect x=".5" y=".5" width="999" height="155" rx="20" fill="none" stroke="#2E2836"/>
  <text x="40" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#A89BB5">What I work on</text>
  <circle cx="58" cy="74" r="16" fill="#8FA6FF" fill-opacity=".18"/>
  <circle cx="58" cy="74" r="6" fill="#8FA6FF"><animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/></circle>
  <text x="90" y="81" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#EDE7F2">AI &amp; ML</text>
  <text x="40" y="114" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#B8AFC2">RAG pipelines, local LLMs and</text>
  <text x="40" y="133" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#B8AFC2">ML models that predict outcomes</text>
  <circle cx="373" cy="74" r="16" fill="#6FD6AE" fill-opacity=".18"/>
  <circle cx="373" cy="74" r="6" fill="#6FD6AE"><animate attributeName="r" values="6;8;6" dur="4s" repeatCount="indefinite"/></circle>
  <text x="405" y="81" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#EDE7F2">Backend</text>
  <text x="355" y="114" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#B8AFC2">REST APIs, relational databases,</text>
  <text x="355" y="133" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#B8AFC2">auth and Dockerised services</text>
  <circle cx="688" cy="74" r="16" fill="#F2B880" fill-opacity=".18"/>
  <circle cx="688" cy="74" r="6" fill="#F2B880"><animate attributeName="r" values="6;8;6" dur="5s" repeatCount="indefinite"/></circle>
  <text x="720" y="81" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#EDE7F2">Web &amp; Mobile</text>
  <text x="670" y="114" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#B8AFC2">Vue, Streamlit and Flutter</text>
  <text x="670" y="133" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#B8AFC2">interfaces on my own APIs</text>
</svg>
