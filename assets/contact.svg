<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150">
  <defs>
    <clipPath id="ccontact"><rect width="1000" height="150" rx="18"/></clipPath>
    <filter id="bcontact" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="gcontact" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <g clip-path="url(#ccontact)">
    <rect width="1000" height="150" fill="#0B1020"/>
    <g filter="url(#bcontact)" opacity=".6">
      <circle cx="200" cy="20" r="68" fill="#4A3B5C">
        <animate attributeName="cx" values="200;400;200" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="150" r="75" fill="#1E3A5F">
        <animate attributeName="cx" values="850;650;850" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1000" height="150" fill="url(#gcontact)"/>
    <rect x=".5" y=".5" width="999" height="149" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="28" cy="28" r="5" fill="#475569"/><circle cx="45" cy="28" r="5" fill="#475569"/><circle cx="62" cy="28" r="5" fill="#475569"/>
    <text x="976" y="33" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">contact.sh</text>
    <text x="28" y="74" font-family="Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">$ echo $STATUS</text>
    <text x="28" y="104" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">Open to internships and collaboration.</text>
    <text x="28" y="128" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">Currently going deeper into RAG evaluation and turning ML models into real products.</text>
    <g transform="translate(790 86)">
      <rect width="180" height="36" rx="18" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".18"/>
      <circle cx="22" cy="18" r="4" fill="#86EFAC"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="36" y="23" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Let's talk</text>
    </g>
  </g>
</svg>
