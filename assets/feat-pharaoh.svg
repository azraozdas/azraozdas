<svg xmlns="http://www.w3.org/2000/svg" width="518" height="328" viewBox="0 0 518 328">
<g transform="translate(14 14)">
  <defs>
    <clipPath id="cpharaoh"><rect width="490" height="300" rx="24"/></clipPath>
    <radialGradient id="rpharaoh" cx="85%" cy="15%" r="70%"><stop offset="0" stop-color="#4F6BE0" stop-opacity=".75"/><stop offset="1" stop-color="#4F6BE0" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#cpharaoh)">
    <rect width="490" height="300" fill="#131B3A"/>
    <rect width="490" height="300" fill="url(#rpharaoh)">
      <animate attributeName="opacity" values=".7;1;.7" dur="6s" repeatCount="indefinite"/></rect>
    <text x="462" y="96" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#fff" fill-opacity=".06">01</text>
    <rect x="32" y="36" width="82" height="24" rx="12" fill="#9FB4FF" fill-opacity=".16"/>
    <text x="44" y="52" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9FB4FF">AI · RAG</text>
    <text x="32" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#E8ECF4">PharaohMind RAG</text>
    <rect x="32" y="124" width="36" height="3" rx="1.5" fill="#9FB4FF">
      <animate attributeName="width" values="36;64;36" dur="4s" repeatCount="indefinite"/></rect>
  <text x="32" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#D9DEE6">A chatbot for Ancient Egypt history whose answers are</text>
  <text x="32" y="172" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#D9DEE6">grounded in a local knowledge base. It shows the</text>
  <text x="32" y="194" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#D9DEE6">passages it retrieved, so every answer can be checked.</text>
  <rect x="32" y="228" width="85" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="74" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">LangChain</text>
  <rect x="125" y="228" width="77" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="163" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">ChromaDB</text>
  <rect x="210" y="228" width="62" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="241" y="243" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">Ollama</text>
  <rect x="32" y="258" width="85" height="22" rx="11" fill="#ffffff14" stroke="#ffffff22"/><text x="74" y="273" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#E7EBF0">Streamlit</text>
    <text x="462" y="244" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9FB4FF">View repo →</text>
