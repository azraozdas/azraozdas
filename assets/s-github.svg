<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64">
  <defs>
    <clipPath id="cgithub"><rect width="1000" height="64" rx="18"/></clipPath>
    <filter id="bgithub" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="ggithub" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <g clip-path="url(#cgithub)">
    <rect width="1000" height="64" fill="#0B1020"/>
    <g filter="url(#bgithub)" opacity=".6">
      <circle cx="200" cy="20" r="29" fill="#334155">
        <animate attributeName="cx" values="200;400;200" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="64" r="32" fill="#1E3A5F">
        <animate attributeName="cx" values="850;650;850" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1000" height="64" fill="url(#ggithub)"/>
    <rect x=".5" y=".5" width="999" height="63" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="28" cy="32" r="5" fill="#475569"/><circle cx="45" cy="32" r="5" fill="#475569"/><circle cx="62" cy="32" r="5" fill="#475569"/>
    <text x="88" y="35" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">$ git log --stat</text>
    <text x="234" y="36" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F1F5F9">On GitHub</text>
    <rect x="329" y="22" width="9" height="17" fill="#A5B4FC">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
