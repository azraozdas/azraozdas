<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270">
  <defs>
    <clipPath id="cstudor"><rect width="490" height="270" rx="18"/></clipPath>
    <filter id="bstudor" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="gstudor" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <g clip-path="url(#cstudor)">
    <rect width="490" height="270" fill="#0B1020"/>
    <g filter="url(#bstudor)" opacity=".6">
      <circle cx="98" cy="20" r="122" fill="#1F4E5A">
        <animate attributeName="cx" values="98;196;98" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="416" cy="270" r="135" fill="#334155">
        <animate attributeName="cx" values="416;318;416" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="490" height="270" fill="url(#gstudor)"/>
    <rect x=".5" y=".5" width="489" height="269" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="28" cy="28" r="5" fill="#475569"/><circle cx="45" cy="28" r="5" fill="#475569"/><circle cx="62" cy="28" r="5" fill="#475569"/>
    <text x="466" y="33" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">AI_SE04_StudyRiskPredictor</text>
    <text x="28" y="72" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#94A3B8">AI · Machine Learning</text>
    <text x="28" y="100" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1F5F9">Studor</text>
    <text x="28" y="122" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">Predicts a student&#x27;s academic risk from attendance, study</text>
    <text x="28" y="143" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">hours, deadlines and workload, then gives personalised</text>
    <text x="28" y="164" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">study advice.</text>
    <rect x="28" y="194" width="107" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="81" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">scikit-learn</text>
    <rect x="143" y="194" width="62" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="174" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">pandas</text>
    <rect x="213" y="194" width="85" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="256" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">Streamlit</text>
    <rect x="306" y="194" width="92" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="352" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">PostgreSQL</text>
    <rect x="28" y="224" width="62" height="22" rx="6" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text x="59" y="239" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">Plotly</text>
  </g>
</svg>
