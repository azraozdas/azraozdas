<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
  <defs>
    <clipPath id="cfocus"><rect width="1000" height="190" rx="18"/></clipPath>
    <filter id="bfocus" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="gfocus" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <g clip-path="url(#cfocus)">
    <rect width="1000" height="190" fill="#0B1020"/>
    <g filter="url(#bfocus)" opacity=".6">
      <circle cx="200" cy="20" r="86" fill="#3B3F6B">
        <animate attributeName="cx" values="200;400;200" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="190" r="95" fill="#334155">
        <animate attributeName="cx" values="850;650;850" dur="12s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1000" height="190" fill="url(#gfocus)"/>
    <rect x=".5" y=".5" width="999" height="189" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="28" cy="28" r="5" fill="#475569"/><circle cx="45" cy="28" r="5" fill="#475569"/><circle cx="62" cy="28" r="5" fill="#475569"/>
    <text x="976" y="33" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">what-i-do.md</text>
    <text x="28" y="80" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#94A3B8">// ai / ml</text>
    <text x="28" y="110" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F1F5F9">AI &amp; ML</text>
    <text x="28" y="138" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">RAG pipelines, local LLMs and ML</text>
    <text x="28" y="158" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">models that predict real outcomes</text>
    <rect x="338" y="64" width="1" height="100" fill="#fff" fill-opacity=".1"/>
    <text x="352" y="80" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#94A3B8">// backend</text>
    <text x="352" y="110" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F1F5F9">Backend</text>
    <text x="352" y="138" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">REST APIs, relational databases,</text>
    <text x="352" y="158" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">auth and Dockerised services</text>
    <rect x="662" y="64" width="1" height="100" fill="#fff" fill-opacity=".1"/>
    <text x="676" y="80" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#94A3B8">// web + mobile</text>
    <text x="676" y="110" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F1F5F9">Web &amp; Mobile</text>
    <text x="676" y="138" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">Vue, Streamlit and Flutter interfaces</text>
    <text x="676" y="158" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">on top of my own APIs</text>
  </g>
</svg>
