<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <clipPath id="card"><rect width="1000" height="300" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#F1F5F9"/><stop offset=".5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="t0"><rect x="96" y="226" height="30" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;.08;.27;.32;1" values="0;470;470;0;0"/></rect></clipPath>
    <clipPath id="t1"><rect x="96" y="226" height="30" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;.333;.413;.6;.653;1" values="0;0;520;520;0;0"/></rect></clipPath>
    <clipPath id="t2"><rect x="96" y="226" height="30" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;.666;.746;.94;.99;1" values="0;0;470;470;0;0"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0B1020"/>
    <!-- aurora blobs -->
    <g filter="url(#blur)" opacity=".55">
      <circle cx="180" cy="60" r="140" fill="#334155">
        <animate attributeName="cx" values="180;300;180" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="240" r="150" fill="#1E3A5F">
        <animate attributeName="cx" values="820;700;820" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;170;240" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="40" r="110" fill="#3B3F6B">
        <animate attributeName="cx" values="620;760;620" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="r" values="110;140;110" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect x=".5" y=".5" width="999" height="299" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

    <!-- window dots -->
    <circle cx="40" cy="36" r="6" fill="#475569"/><circle cx="60" cy="36" r="6" fill="#475569"/><circle cx="80" cy="36" r="6" fill="#475569"/>
    <text x="960" y="41" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">~/azraozdas</text>

    <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
      <text x="64" y="118" font-size="17" fill="#94A3B8" font-family="Menlo, Consolas, monospace">$ whoami</text>
      <text x="62" y="176" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="-1">Azra Özdaş</text>
      <text x="64" y="210" font-size="19" fill="#CBD5E1">Software Engineering Student  ·  AI &amp; Backend Developer</text>
    </g>

    <g font-family="Menlo, Consolas, monospace" font-size="17" font-weight="600">
      <text x="64" y="249" fill="#A5B4FC">&gt;</text>
      <text x="96" y="249" fill="#CBD5E1" clip-path="url(#t0)">building AI apps that answer real questions</text>
      <text x="96" y="249" fill="#CBD5E1" clip-path="url(#t1)">RAG chatbots · ML risk prediction · REST APIs</text>
      <text x="96" y="249" fill="#CBD5E1" clip-path="url(#t2)">Python · Java · TypeScript · Flutter</text>
    </g>

    <!-- status pill -->
    <g transform="translate(770 96)">
      <rect width="170" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="20" cy="17" r="4" fill="#86EFAC">
        <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">Open to internships</text>
    </g>
  </g>
</svg>
